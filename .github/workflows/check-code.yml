name: Проверка кода 1С

on:
    push:
        branches: ["master", "main"]
    pull_request:
        branches: ["master", "main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Копирование репозитория
              uses: actions/checkout@v4

            - name: Запуск BSL Language Server (Docker)
              uses: docker://1csyntax/bsl-language-server:latest
              with:
                  args: analyze --path /github/workspace
