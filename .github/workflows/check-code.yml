name: Проверка кода 1С

on:
    push:
        branches: ["master", "main"]
    pull_request:
        branches: ["master", "main"]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Копирование репозитория
              uses: actions/checkout@v4

            - name: Запуск BSL Language Server
              uses: 1c-syntax/bsl-language-server-action@v0.1.0
              with:
                  # Проверяем текущую директорию
                  path: .
